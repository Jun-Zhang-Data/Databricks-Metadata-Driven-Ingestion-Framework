resources:
  jobs:
    metadata_bootstrap:
      name: "[${bundle.target}] metadata-ingestion-bootstrap"
      tasks:
        - task_key: setup
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - setup
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

        - task_key: seed_initial_data
          depends_on:
            - task_key: setup
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - seed-initial-data
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

        - task_key: seed_metadata
          depends_on:
            - task_key: seed_initial_data
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - seed-metadata
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

        - task_key: ingest_all
          depends_on:
            - task_key: seed_metadata
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - ingest
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

        - task_key: verify
          depends_on:
            - task_key: ingest_all
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - verify
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

    metadata_ingest:
      name: "[${bundle.target}] metadata-ingestion-run"
      tasks:
        - task_key: ingest_all
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - ingest
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

        - task_key: verify
          depends_on:
            - task_key: ingest_all
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - verify
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

    metadata_demo_update:
      name: "[${bundle.target}] metadata-ingestion-demo-update"
      tasks:
        - task_key: seed_incremental_data
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - seed-incremental-data
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

        - task_key: ingest_all
          depends_on:
            - task_key: seed_incremental_data
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - ingest
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

        - task_key: verify
          depends_on:
            - task_key: ingest_all
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - verify
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

    metadata_upgrade:
      name: "[${bundle.target}] metadata-ingestion-upgrade"
      tasks:
        - task_key: upgrade_metadata
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - upgrade-metadata
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

        - task_key: verify
          depends_on:
            - task_key: upgrade_metadata
          environment_key: default
          python_wheel_task:
            package_name: metadata_driven_ingestion
            entry_point: metadata_ingestion
            parameters:
              - verify
              - --catalog
              - ${var.catalog}
              - --metadata-schema
              - ${var.metadata_schema}
              - --ops-schema
              - ${var.ops_schema}
              - --bronze-schema
              - ${var.bronze_schema}
              - --raw-volume
              - ${var.raw_volume}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
